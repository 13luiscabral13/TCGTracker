<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCG Tracker</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: rgba(15, 23, 42, 0.86);
        --panel-alt: rgba(30, 41, 59, 0.8);
        --card: rgba(15, 118, 110, 0.12);
        --text: #e2e8f0;
        --muted: #a5b4cf;
        --accent: #8b5cf6;
        --accent-2: #22c55e;
        --accent-3: #38bdf8;
        --soft: #cbd5e1;
      }
      * { box-sizing: border-box; }
      body {
        font-family: Arial, sans-serif; margin: 0; background:
          radial-gradient(circle at top, rgba(139, 92, 246, 0.22), transparent 30%),
          linear-gradient(145deg, #020817, #111827 40%, #0f172a);
        color: var(--text);
      }
      .page {
        width: 100%; max-width: none; margin: 0 auto; padding: 18px 18px 28px; min-height: 100vh;
      }
      h1 {
        font-size: clamp(2.2rem, 4vw, 3.2rem);
        margin: 0 0 8px;
        letter-spacing: -0.05em;
      }
      h2 {
        margin: 0 0 0.7rem;
        font-size: 1.2rem;
      }
      .subhead {
        color: var(--muted);
        margin-bottom: 22px;
        font-size: 1rem;
      }
      .stats {
        display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.7rem;
      }
      .stat {
        background: linear-gradient(180deg, rgba(139, 92, 246, 0.18), rgba(15, 23, 42, 0.9));
        border: 1px solid rgba(196,181,253,0.2);
        padding: 0.9rem 1rem; border-radius: 14px; min-width: 140px;
        box-shadow: 0 12px 24px rgba(0,0,0,0.15);
      }
      .stat strong {
        display: block; font-size: 1.5rem; margin-bottom: 0.15rem;
      }
      .layout {
        display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 1.25rem; align-items: start;
        width: 98%; max-width: none; margin: 0 auto;
        min-height: calc(100vh - 140px);
      }
      .sidebar {
        position: sticky; top: 18px;
        display: flex; flex-direction: column; gap: 0.85rem;
      }
      .sidebar-panel {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.75));
        border: 1px solid rgba(148,163,184,0.16); border-radius: 20px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.18); overflow: hidden;
      }
      .menu-toggle {
        width: 100%; border: none; border-radius: 0; background: rgba(15,23,42,0.45); color: var(--text);
        padding: 0.9rem 1rem; text-align: left; font-weight: 700; cursor: pointer; border-bottom: 1px solid rgba(148,163,184,0.12);
        display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .menu-toggle:hover { background: rgba(59,130,246,0.15); }
      .menu-toggle::after {
        content: '▾';
        color: #c4b5fd; font-size: 0.8rem;
      }
      .menu-toggle.active {
        background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(56,189,248,0.16));
      }
      .menu-toggle.active::after { content: '▴'; }
      .menu-panel {
        display: none; padding: 0.9rem 0.9rem 1rem; border-top: 1px solid rgba(148,163,184,0.12);
      }
      .menu-panel.open { display: block; }
      .sidebar .card {
        background: transparent; border: none; box-shadow: none; padding: 0; border-radius: 0;
      }
      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: static;
        }
      }
      .grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem;
        min-height: calc(100vh - 180px);
      }
      .card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.7));
        border: 1px solid rgba(148,163,184,0.16); border-radius: 20px;
        padding: 1rem; box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      }
      form { display: flex; flex-direction: column; gap: 0.7rem; }
      input, select, textarea, button {
        padding: 0.7rem 0.8rem; border-radius: 10px; border: 1px solid rgba(148,163,184,0.2);
        font-size: 1rem; background: rgba(15,23,42,0.8); color: var(--text);
      }
      input::placeholder, textarea::placeholder { color: var(--muted); }
      button {
        background: linear-gradient(135deg, #8b5cf6, #2563eb); color: white; border: none; cursor: pointer;
        font-weight: 700; transition: transform 0.15s ease;
      }
      button:hover { transform: translateY(-1px); }
      ul { padding-left: 1.2rem; color: var(--muted); }
      .catalog-sections {
        display: flex; flex-direction: column; gap: 1rem;
        padding-right: 0.2rem;
      }
      .product-group {
        padding: 0.9rem 0.9rem 0.2rem;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.55), rgba(15, 23, 42, 0.36));
        border: 1px solid rgba(148,163,184,0.12);
        display: flex; flex-direction: column; gap: 0.75rem;
      }
      .group-title {
        margin: 0;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        display: inline-block;
        width: fit-content;
        font-size: 0.78rem;
        color: #f5f3ff;
        background: linear-gradient(135deg, rgba(139,92,246,0.35), rgba(56,189,248,0.2));
        border: 1px solid rgba(196,181,253,0.18);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .product-gallery {
        display: flex; gap: 1rem; overflow-x: auto; padding: 0.25rem 0.1rem 0.6rem; scroll-snap-type: x proximity;
        align-items: stretch;
      }
      .product-box {
        flex: 0 0 190px; width: 190px;
        background: linear-gradient(180deg, rgba(15,118,110,0.18), rgba(15, 23, 42, 0.75));
        border: 1px solid rgba(148,163,184,0.15); border-radius: 16px; overflow: hidden;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        scroll-snap-align: start;
      }
      .product-box:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(0,0,0,0.22);
        border-color: rgba(139, 92, 246, 0.35);
      }
      .product-box img {
        width: 100%; height: 220px; object-fit: cover; display: block; background: #0f172a;
      }
      .product-box .meta {
        padding: 0.8rem 0.9rem 1rem;
      }
      .product-box h4 {
        margin: 0 0 0.25rem; font-size: 1rem;
        color: #f8fafc;
      }
      .product-box p {
        margin: 0; color: var(--muted); font-size: 0.85rem;
      }
      .mini-button {
        display: inline-block; width: 100%; margin-top: 0.75rem; padding: 0.6rem 0.7rem; border-radius: 10px;
        background: linear-gradient(135deg, rgba(59,130,246,0.35), rgba(14,165,233,0.2));
        border: 1px solid rgba(147,197,253,0.3); color: var(--text); cursor: pointer;
        font-weight: 700;
      }
      .price-table-wrap {
        overflow-x: auto; margin-top: 1rem;
      }
      .price-table {
        width: 100%; border-collapse: collapse; min-width: 520px;
      }
      .price-table th, .price-table td {
        border-bottom: 1px solid rgba(148,163,184,0.15); padding: 0.75rem 0.5rem; text-align: left;
      }
      .price-table th { color: var(--muted); font-weight: 600; }
      .price-chip {
        display: inline-block; background: rgba(34,197,94,0.16); color: #bbf7d0; padding: 0.2rem 0.5rem; border-radius: 999px;
        font-size: 0.8rem;
      }
      .price-chip.warning {
        background: rgba(245,158,11,0.14); color: #fcd34d;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>TCG Tracker</h1>
      <div class="subhead">Lorcana price tracker for Portuguese stores</div>

      <div class="stats">
        <div class="stat"><strong id="storeCount">0</strong> stores</div>
        <div class="stat"><strong id="productCount">0</strong> products</div>
        <div class="stat"><strong id="trackingCount">0</strong> trackers</div>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-panel">
            <button class="menu-toggle active" type="button" data-target="storePanel">Stores</button>
            <div id="storePanel" class="menu-panel open">
              <section class="card">
                <h2>Add store</h2>
                <form id="storeForm">
                  <input name="name" placeholder="Store name" required />
                  <input name="website" placeholder="Website URL" />
                  <input name="country" value="PT" placeholder="Country" />
                  <textarea name="selectors" rows="4" placeholder='{"price": ".price", "name": "h1", "promo": ".promo"}'></textarea>
                  <button type="submit">Save store</button>
                </form>
                <ul id="storesList"></ul>
              </section>
            </div>

            <button class="menu-toggle" type="button" data-target="productPanel">Products</button>
            <div id="productPanel" class="menu-panel">
              <section class="card">
                <h2>Add product</h2>
                <form id="productForm">
                  <input name="name" placeholder="Product name" required />
                  <input name="set_name" placeholder="Set / collection" />
                  <input name="card_number" placeholder="Product code" />
                  <button type="submit">Save product</button>
                </form>
              </section>
            </div>

            <button class="menu-toggle" type="button" data-target="trackerPanel">Tracker</button>
            <div id="trackerPanel" class="menu-panel">
              <section class="card">
                <h2>Add tracker</h2>
                <form id="trackingForm">
                  <select id="trackingProduct" name="product_id" required></select>
                  <select id="trackingStore" name="store_id" required></select>
                  <input name="product_url" placeholder="Product URL" required />
                  <button type="submit">Save tracker</button>
                </form>
                <ul id="trackingsList"></ul>
              </section>
            </div>

            <button class="menu-toggle" type="button" data-target="notificationPanel">Notifications</button>
            <div id="notificationPanel" class="menu-panel">
              <section class="card">
                <h2>Notifications</h2>
                <form id="notificationForm">
                  <input name="name" placeholder="Channel name" required />
                  <select name="channel_type">
                    <option value="email">email</option>
                    <option value="discord">discord</option>
                    <option value="telegram">telegram</option>
                  </select>
                  <input name="target" placeholder="Email / webhook / chat id" required />
                  <button type="submit">Save channel</button>
                </form>
                <ul id="notificationsList"></ul>
              </section>
            </div>
          </div>
        </aside>

        <main class="content">
          <div class="grid">
            <section class="card" style="grid-column: 1 / -1;">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem;">
                <h2 style="margin: 0;">Catalog</h2>
                <button id="refreshButton" type="button">Refresh prices</button>
              </div>
              <div id="productsGallery" class="catalog-sections"></div>
            </section>

            <section class="card" style="grid-column: 1 / -1;">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <h2 style="margin: 0;">Price watchboard</h2>
              </div>
              <div class="price-table-wrap">
                <table class="price-table">
                  <thead id="priceTableHead"></thead>
                  <tbody id="priceTableBody"></tbody>
                </table>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script>
      function inferProductCategory(productName) {
        const name = (productName || '').toLowerCase();
        if (name.includes('booster box')) return 'Booster Boxes';
        if (name.includes('bundle')) return 'Bundles';
        if (name.includes('booster pack')) return 'Booster Packs';
        if (name.includes('portfolio')) return 'Portfolios';
        if (name.includes('starter deck')) return 'Starter Decks';
        if (name.includes('starter set')) return 'Starter Sets';
        if (name.includes('gift set') || name.includes('trove')) return 'Gift Sets & Troves';
        if (name.includes('playmat')) return 'Playmats';
        if (name.includes('storage box') || name.includes('deck protector')) return 'Accessories';
        if (name.includes('box')) return 'Boxes';
        if (name.includes('pack')) return 'Packs';
        return 'Other';
      }

      function groupProductsByCategory(items) {
        const groups = {};
        const orderedKeys = ['Booster Boxes', 'Bundles', 'Booster Packs', 'Portfolios', 'Starter Decks', 'Starter Sets', 'Gift Sets & Troves', 'Playmats', 'Accessories', 'Boxes', 'Packs', 'Other'];

        items.forEach(item => {
          const category = inferProductCategory(item.name || item.product_name);
          if (!groups[category]) groups[category] = [];
          groups[category].push(item);
        });

        const orderedGroups = {};
        orderedKeys.forEach(key => {
          if (groups[key]) orderedGroups[key] = groups[key];
        });
        Object.keys(groups).forEach(key => {
          if (!orderedGroups[key]) orderedGroups[key] = groups[key];
        });
        return orderedGroups;
      }

      async function loadDashboard() {
        const [storesRes, productsRes, trackingsRes, summaryRes, notificationsRes, dashboardRes] = await Promise.all([
          fetch('/api/stores'),
          fetch('/api/products'),
          fetch('/api/trackings'),
          fetch('/api/tracking-summary'),
          fetch('/api/notifications'),
          fetch('/api/dashboard')
        ]);

        const stores = await storesRes.json();
        const products = await productsRes.json();
        const trackings = await trackingsRes.json();
        const summary = await summaryRes.json();
        const notifications = await notificationsRes.json();
        const dashboard = await dashboardRes.json();

        document.getElementById('storeCount').textContent = dashboard.stores;
        document.getElementById('productCount').textContent = dashboard.products;
        document.getElementById('trackingCount').textContent = dashboard.trackings;

        const storesList = document.getElementById('storesList');
        storesList.innerHTML = stores.map(s => `<li>${s.name} — ${s.country}</li>`).join('');

        const productStoreCounts = {};
        trackings.forEach(item => {
          const productId = String(item.product_id ?? item.productId ?? item.id);
          productStoreCounts[productId] = (productStoreCounts[productId] ?? 0) + 1;
        });

        const productsGallery = document.getElementById('productsGallery');
        const productGroups = groupProductsByCategory(products);
        productsGallery.innerHTML = Object.entries(productGroups).map(([category, groupProducts]) => `
          <div class="product-group">
            <h3 class="group-title">${category}</h3>
            <div class="product-gallery">
              ${groupProducts.map(p => {
                const trackedCount = productStoreCounts[String(p.id)] ?? 0;
                const trackedLabel = trackedCount === 0
                  ? 'No stores tracked'
                  : `${trackedCount} store${trackedCount === 1 ? '' : 's'} tracked`;
                return `
                  <div class="product-box">
                    <img src="${p.image_url || 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80'}" alt="${p.name}" />
                    <div class="meta">
                      <h4>${p.name}</h4>
                      <p>${p.set_name || 'Collection'}</p>
                      <div style="margin-top: 0.6rem; font-size: 0.72rem; color: #c4b5fd; font-weight: 700; letter-spacing: 0.02em;">${trackedLabel}</div>
                      <a class="mini-button" href="/products/${p.id}">Open comparison</a>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `).join('');

        const priceTableHead = document.getElementById('priceTableHead');
        const priceTableBody = document.getElementById('priceTableBody');
        const storeColumns = stores.map(store => store.name);
        priceTableHead.innerHTML = '<tr><th>Product</th>' + storeColumns.map(name => `<th>${name}</th>`).join('') + '</tr>';

        const productPriceMap = {};
        summary.forEach(item => {
          if (!productPriceMap[item.product_name]) {
            productPriceMap[item.product_name] = {};
          }
          productPriceMap[item.product_name][item.store_name] = item;
        });

        const productNames = Object.keys(productPriceMap).sort((a, b) => {
          return inferProductCategory(a).localeCompare(inferProductCategory(b)) || a.localeCompare(b);
        });

        if (productNames.length === 0) {
          priceTableBody.innerHTML = '<tr><td colspan="' + (storeColumns.length + 1) + '">No price data yet. Add a tracker to start seeing live prices.</td></tr>';
        } else {
          priceTableBody.innerHTML = productNames.map(productName => {
            const row = productPriceMap[productName];
            return '<tr><td><strong>' + productName + '</strong><div style="font-size: 0.72rem; color: #a5b4cf; margin-top: 0.2rem;">' + inferProductCategory(productName) + '</div></td>' + storeColumns.map(storeName => {
              const item = row[storeName];
              if (!item) return '<td>—</td>';
              const priceLabel = item.last_seen_price != null ? '€' + Number(item.last_seen_price).toFixed(2) : '—';
              const promoClass = item.last_seen_promo ? 'price-chip' : 'price-chip warning';
              const promoText = item.last_seen_promo ? 'Promo' : 'Normal';
              return '<td><div>' + priceLabel + '</div><span class="' + promoClass + '">' + promoText + '</span></td>';
            }).join('') + '</tr>';
          }).join('');
        }

        const trackingsList = document.getElementById('trackingsList');
        trackingsList.innerHTML = summary.length
          ? summary.map(item => `<li><strong>${item.product_name}</strong> @ ${item.store_name} — ${item.last_seen_price != null ? '€' + Number(item.last_seen_price).toFixed(2) : 'No price'}${item.last_seen_promo ? ' · promo' : ''}</li>`).join('')
          : '<li>No trackers yet. Add one to start saving prices.</li>';

        const notificationsList = document.getElementById('notificationsList');
        notificationsList.innerHTML = notifications.map(n => `<li>${n.name} (${n.channel_type})</li>`).join('');

        const productSelect = document.getElementById('trackingProduct');
        productSelect.innerHTML = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        const storeSelect = document.getElementById('trackingStore');
        storeSelect.innerHTML = stores.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

      }

      document.querySelectorAll('.menu-toggle').forEach(button => {
        button.addEventListener('click', () => {
          const target = document.getElementById(button.dataset.target);
          const isOpen = target.classList.contains('open');

          document.querySelectorAll('.menu-panel').forEach(panel => panel.classList.remove('open'));
          document.querySelectorAll('.menu-toggle').forEach(item => item.classList.remove('active'));

          if (!isOpen) {
            target.classList.add('open');
            button.classList.add('active');
          }
        });
      });

      document.getElementById('storeForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.target));
        payload.selectors = JSON.parse(payload.selectors || '{}');
        await fetch('/api/stores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        event.target.reset();
        loadDashboard();
      });

      document.getElementById('productForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.target));
        await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        event.target.reset();
        loadDashboard();
      });

      document.getElementById('trackingForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.target));
        await fetch('/api/trackings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            product_id: Number(payload.product_id),
            store_id: Number(payload.store_id),
            product_url: payload.product_url,
            is_active: true
          })
        });
        event.target.reset();
        loadDashboard();
      });

      document.getElementById('notificationForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.target));
        await fetch('/api/notifications', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        event.target.reset();
        loadDashboard();
      });

      document.getElementById('refreshButton').addEventListener('click', async () => {
        await fetch('/api/sync', { method: 'POST' });
        loadDashboard();
      });

      loadDashboard();
    </script>
  </body>
</html>
